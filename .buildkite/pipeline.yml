notify:
  - github_commit_status:
      context: "my-custom-status"

steps:
  - label: ":mag: Lint"
    key: "lint"
    command: "python3 -m compileall -q calculator tests"

  - label: ":test_tube: Tests %n"
    key: "tests"
    depends_on: "lint"
    parallelism: 2
    env:
      # Debian/Ubuntu agents block pip outside a venv (PEP 668); a --user install
      # in a throwaway CI job is fine. Older pip versions ignore this variable.
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    command: |
      python3 -m pip install --quiet --user pytest
      bktec run
    plugins:
      # Installs bktec, authenticates with OIDC (no stored token) and splits
      # tests across the parallel jobs using Test Engine timing data.
      - tests#v1.1.0:
          test-runner: pytest
          # --user installs don't put pytest on PATH, so call it via python3 -m.
          test-cmd: "python3 -m pytest {{testExamples}} --junit-xml={{resultPath}}"
    retry:
      automatic:
        - exit_status: -1   # agent lost
          limit: 2

  - label: ":computer: Smoke run"
    depends_on: "tests"
    command: "python3 -m calculator add 2 3"

  - block: ":rocket: Release?"
    key: "approve"
    depends_on: "tests"
    branches: "main"

  - label: ":package: Fake deploy"
    depends_on: "approve"
    branches: "main"
    command: 'echo "Deploying commit $$BUILDKITE_COMMIT from build #$$BUILDKITE_BUILD_NUMBER"'
