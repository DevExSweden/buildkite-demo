# Bootstrap: generates the real steps at build time. The hand-written version
# is kept in pipeline.static.yml as an example; to use it instead, replace the
# command below with: buildkite-agent pipeline upload .buildkite/pipeline.static.yml
steps:
  - label: ":pipeline: Generate pipeline"
    key: "generate"
    command: |
      set -euo pipefail
      python3 .buildkite/generate_pipeline.py | buildkite-agent pipeline upload
